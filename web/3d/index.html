<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Blood Bowl — pitch (3D)</title>
    <script>
      // RULE 3: compute the base FIRST — "" on the host window, "/agents/<slug>" through
      // the fleet proxy. Everything else prefixes it. The stylesheet is hand-prefixed
      // because it loads before any script could help.
      window.__base = location.pathname.split("/plugins/")[0];
      document.write('<link rel="stylesheet" href="' + window.__base + '/_ds/plugin-kit.css">');
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; }
      body { background: var(--pl-color-bg, #0b0f0c); color: var(--pl-color-fg, #e8e8e8); }
      /* The HUD must be readable BEFORE the theme handshake lands, and on whatever the
         operator's theme turns out to be. `var(--pl-color-fg, …)` does not do that: the
         kit's stylesheet DEFINES that token, so the fallback never applies and the text
         inherits whatever the kit defaults to — which was dark-on-dark here. An explicit
         colour plus its own backdrop is legible against any theme and against the pitch
         itself. Same class as the odds badge that drew white on white for weeks. */
      #hud {
        position: absolute; z-index: 1; margin: 8px; padding: 6px 10px; border-radius: 6px;
        font: 12px/1.4 system-ui, sans-serif; pointer-events: none;
        color: #f2f4f2; background: rgba(8, 12, 9, 0.72);
      }
    </style>
    <script type="module" crossorigin src="./assets/index-B0AKwhox.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
