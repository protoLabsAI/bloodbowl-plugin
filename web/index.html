<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Bowl Pitch</title>
<script>
  // The slug-derived base. Everything else is loaded relative to it, so the view
  // works unchanged behind a fleet proxy that mounts the instance on a sub-path.
  var BASE = location.pathname.split("/plugins/")[0];
  var SELF = BASE + "/plugins/bloodbowl/static";
  // A VERSIONED PATH, stamped by the view route whenever the assets change.
  //
  // Cache headers alone could not fix this, and it is worth knowing why: a browser
  // that already holds a copy it believes is fresh DOES NOT ASK, so it never
  // receives the header telling it to stop believing that. Observed on a live
  // agent — the access log showed the PAGE fetched every time and the modules not
  // once. A new URL has no cache entry, so it must be fetched, and the page is the
  // one thing that was always fresh.
  //
  // A PATH rather than `?v=`, because the modules import each OTHER by relative
  // specifier ("./board.js"). A query string busts only the file the page names,
  // so main.js would arrive new and import a cached board.js — and that is worse
  // than stale, because the new main.js imports `setPitch` which the old board.js
  // does not export, and the whole module graph throws. Under a versioned
  // directory every relative import inherits the stamp for free.
  var STAMP = "__ASSET_STAMP__";
  if (STAMP.indexOf("ASSET_STAMP") < 0) SELF += "/v/" + STAMP;
  (function () {
    for (var href of [BASE + "/_ds/plugin-kit.css", SELF + "/style.css"]) {
      var l = document.createElement("link"); l.rel = "stylesheet"; l.href = href;
      document.head.appendChild(l);
    }
  })();
</script>
</head><body><div class="wrap">

<div id="err" class="pl-callout pl-callout--error" hidden></div>

<div class="bar">
  <div class="modes">
    <button id="modeSetup" class="mode is-on">Setup</button>
    <button id="modePlay" class="mode">Play</button>
  </div>

  <!-- setup mode -->
  <span class="mode-setup">
    <label>Home <select id="homeTeam"></select></label>
    <label>Away <select id="awayTeam"></select></label>
    <label>Preset <select id="presetPick"></select></label>
    <button id="presetLoad">Load</button>
    <button id="presetMirror" title="Load flipped into the away half">Mirror</button>
    <button id="presetSave">Save as…</button>
  </span>

  <!-- play mode -->
  <span class="mode-play" hidden>
    <span id="clock" class="chip mono"></span>
    <span id="score" class="chip mono"></span>
    <span id="activeSide" class="chip"></span>
    <span id="whose" class="chip" hidden></span>
  </span>

  <span id="coord" class="mono muted"></span>
  <span class="grow"></span>
  <span id="counts" class="muted"></span>

  <span class="mode-setup">
    <button id="undo" disabled>Undo</button>
    <button id="clearHome">Clear home</button>
    <button id="clearAway">Clear away</button>
    <button id="clearAll">Clear pitch</button>
  </span>
  <span class="mode-play" hidden>
    <button id="endTurn">End turn</button>
    <button id="kickoff">Kick off</button>
    <label class="chip" title="Play the agent: you take this side, it takes the other. Off = one coach moves both teams.">
      <input type="checkbox" id="versus"> vs. agent
      <select id="mySide"><option value="home">as home</option><option value="away">as away</option></select>
    </label>
    <button id="newMatch">New match</button>
    <button id="abandon">Abandon</button>
  </span>
</div>

<!-- A Kick-off Event that asks the Coach something. Nothing else on the board
     works until it is answered, so the question sits above the pitch rather than
     in the log, where it would scroll away. -->
<div id="choice" class="choice" hidden>
  <span id="choiceText"></span>
  <span class="grow"></span>
  <span id="choicePicked" class="mono muted"></span>
  <button id="choiceConfirm" hidden>Confirm</button>
  <button id="choiceUndo" hidden>Undo</button>
  <button id="choiceDecline">Decline</button>
</div>

<div class="stage">
  <div class="corner"></div>
  <div class="ruler ruler-top" id="rtop"></div>
  <div class="ruler ruler-left" id="rleft"></div>
  <div class="board-outer">
    <div class="board" id="board"></div>
    <svg class="overlay" id="ov" preserveAspectRatio="none"></svg>
    <!-- Labelled by WHO SCORES THERE, not by whose End Zone it is. Both readings
         are true, but you score in the OPPOSITION's End Zone, so the possessive
         one answers the wrong question — a home carrier standing in row 1 under a
         "HOME" sign reads as an unscored touchdown, and it cost a live false bug
         report. The engine was right all along (`touchdown_row("home") == 26`).
         The 3D board was fixed at the time; this is the sign it left behind. -->
    <div class="ezlab" style="left:2px">AWAY SCORES HERE</div>
    <div class="ezlab" style="right:2px">HOME SCORES HERE</div>
  </div>
</div>

<!-- setup mode -->
<div class="cols mode-setup">
  <div class="pal" id="palHome"></div>
  <div class="pal" id="palAway"></div>
</div>
<div class="bar mode-setup" style="margin-top:8px">
  <div id="trash">Drag a player here to remove them</div>
  <span class="muted">Click a position then click a square, or drag. Click a player to select; Delete removes.</span>
</div>

<!-- play mode -->
<div class="playpanes mode-play" hidden>
  <div class="pane">
    <h5>Selected</h5>
    <div id="sel" class="muted">Click one of your players to see where they can go.</div>
  </div>
  <div class="pane">
    <h5>Match log</h5>
    <div id="log" class="log"></div>
  </div>
</div>

</div>
<div id="card"></div>

<script>
  // Injected rather than written as <script src>: the path has to be the
  // slug-aware one, and a root-absolute src would 404 behind a fleet proxy.
  (function () {
    var s = document.createElement("script");
    s.type = "module"; s.src = SELF + "/js/main.js";
    document.body.appendChild(s);
  })();
</script>
</body></html>
