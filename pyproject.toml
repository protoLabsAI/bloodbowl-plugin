[project]
name = "bloodbowl-plugin"
version = "0.5.0"
description = "Blood Bowl pitch, scenario board and S3 roster reference for protoAgent"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# view.py holds one embedded HTML document; wrapping its markup to 120 columns
# would hurt readability rather than help it.
"view.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
