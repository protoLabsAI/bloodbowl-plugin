id: bloodbowl
name: Blood Bowl (pitch, scenarios, rosters)
version: 0.8.0
description: >-
  A real 26x15 Blood Bowl pitch you can play on. Set a scenario up by hand, from a
  preset, or by asking the agent — then play it from kick-off to full time with the
  engine adjudicating movement, blocking, injuries, the ball and the clock. Ships
  parsed Third Season Edition (S3) data for 30 teams and 63 star players, so stats
  come from a table rather than from recall, and every roll is logged with its
  arithmetic. No network access, no secrets.
enabled: false
repository: https://github.com/protoLabsAI/bloodbowl-plugin
min_protoagent_version: "0.27.0"

config_section: bloodbowl
config:
  # Where the current board is persisted. Empty = the plugin's own state/ dir.
  state_dir: ""
  # Let the agent play its own turns, unprompted.
  #
  # OFF by default, and that default is deliberate. Auto mode is a background
  # loop that spends MODEL CAPACITY with nobody watching: a full-AI match is
  # ~32 turns of tool-calling that will happily run for an hour against the
  # same gateway your real work queues on. Head-to-head play does not need it
  # — ending your turn nudges the agent directly — so turning this on is a
  # choice to let the machine play by itself, made once, on purpose.
  auto_play: false
  # Your own player icons. Empty = the ones that ship with the plugin.
  #
  # A pack only needs to hold what it REPLACES — resolution falls through per
  # positional, so one redrawn Troll leaves the other 152 alone. Name a file
  # `<team>__<position>.png` in our own words (`orc__orc-lineman.png`) and it is
  # picked up with no table and no code change. `sprites.json` in the same folder
  # is the explicit form, and takes `columns` for art that does not follow the
  # shipped four-column (two red, two blue) convention.
  sprite_dir: ""

views:
  - { id: pitch, label: "Pitch", icon: LayoutGrid, path: /plugins/bloodbowl/view }
  # The 3D board, served by a REAL route (Rule 1 of the plugin-view guide). Declaring the
  # built file inside the static tree served fine by hand but is the wrong shape: the
  # host validates a view path against the paths its ROUTERS serve, by exact match, so a
  # `{path:path}` route can never match a concrete file under it — it warned on every
  # boot. A new route needs a PROCESS RESTART to appear (FastAPI cannot swap a mounted
  # router); the static assets it pulls in do not.
  - { id: pitch3d, label: "Pitch 3D", icon: Box, path: /plugins/bloodbowl/view3d }
  # The model library — upload a mesh per positional, organised by team. Its page is a
  # real route like the others; the meshes themselves stay GATED under /api/, because a
  # coach's uploads are their files and should not become unauthenticated content.
  - { id: models, label: "Models", icon: Boxes, path: /plugins/bloodbowl/models }
  # The roster builder — draft a Team Draft List against the S3 rules, save it, and place
  # it on the board for scenario work. Costing and legality are decided SERVER-side by the
  # same functions that gate placement, so the builder cannot be a second rulebook.
  - { id: draft, label: "Rosters", icon: ClipboardList, path: /plugins/bloodbowl/draft }

# The host auto-exempts a DECLARED VIEW's own path from the auth gate, because the
# console iframes it with a plain navigation that cannot carry a bearer. It does
# not exempt the page's siblings — and since the view became real files rather
# than one inline string, the stylesheet and the ES modules are siblings. Without
# this the page loads 200 and every asset 401s: an unstyled, dead board on any
# token-gated deployment. Only the static tree is listed; all data stays gated
# under /api/plugins/bloodbowl/.
public_paths:
  - /plugins/bloodbowl/static/

capabilities:
  network: []
  filesystem: scoped
